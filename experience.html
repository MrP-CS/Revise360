<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Experience</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="player">
<div id="v" aria-label="360 degree scene. Drag or use the arrow keys to look around. Select a numbered badge to answer questions, or a blue i marker to find out more."></div>
<div class="hudbar">
  <div class="pill"><nav class="nav" id="nav" aria-label="Scenes"></nav></div>
  <div class="pill hud" id="hud" aria-live="polite"></div>
</div>
<div class="tools" role="toolbar" aria-label="Experience tools">
  <button id="homeBtn">⌂ Home</button>
  <button id="vrBtn" class="vr" hidden>🥽 Enter VR</button>
  <button id="progBtn">My progress</button>
  <button id="reviewBtn" aria-pressed="false">Review mode</button>
  <a id="wsBtn" hidden download>⬇ Worksheet</a>
  <button id="helpBtn">Help</button>
</div>
<div class="toast" id="toast" role="status" hidden></div>
<aside class="drawer" id="drawer" aria-live="polite"></aside>
<div id="modal" role="dialog" aria-modal="true" aria-labelledby="mt"><div class="box" id="box"></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="js/config.js"></script>
<script src="js/store.js"></script>
<script src="js/models.js"></script>
<script src="js/logic.js"></script>
<script src="js/defence.js"></script>
<script src="js/player.js"></script>
<script src="js/vr.js"></script>
</body></html>
