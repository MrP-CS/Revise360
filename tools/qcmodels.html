<!doctype html>
<html><head><meta charset="utf-8"><title>3D model QC</title></head>
<body style="margin:0;background:#101828">
<!--
  Checks every 3D model for the failure that matters most: a part that is
  labelled and clickable, so a pupil can select it, but contributes no visible
  pixels from any angle - because it sits inside an opaque case, is hidden
  behind another part, or has no size.

  For each part it renders the model with that part hidden and diffs against the
  baseline. A part that changes nothing is a part nobody can see.
-->
<div id="host"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="../js/models.js"></script>
<script>
const T = THREE;
const ANGLES = [[.45, -.6], [.45, 1.0], [.2, 2.4], [1.0, 3.9], [-.3, 5.2]];

function renderOnce(r, scene, cam, b, rx, ry) {
  b.group.rotation.set(0, ry, 0);
  b.group.scale.setScalar(b.scale);
  const dist = 5;
  cam.position.set(0, Math.sin(rx) * dist, Math.cos(rx) * dist);
  cam.lookAt(0, 0, 0);
  r.render(scene, cam);
  const gl = r.getContext();
  const px = new Uint8Array(gl.drawingBufferWidth * gl.drawingBufferHeight * 4);
  gl.readPixels(0, 0, gl.drawingBufferWidth, gl.drawingBufferHeight, gl.RGBA, gl.UNSIGNED_BYTE, px);
  return px;
}
function diff(a, b2) {
  let n = 0;
  for (let i = 0; i < a.length; i += 4) {
    if (Math.abs(a[i] - b2[i]) + Math.abs(a[i+1] - b2[i+1]) + Math.abs(a[i+2] - b2[i+2]) > 18) n++;
  }
  return n;
}
function setVisible(part, v) { part.obj.traverse(o => { if (o.isMesh) o.visible = v; }); }

// ---- orientation -----------------------------------------------------------
// Plenty of things stand perpendicular to a board quite correctly: heatsink
// fins, port blocks, a memory module in its slot. What is always wrong is a
// component that passes THROUGH the board instead of sitting on its face -
// which is what happens when a chip meant for a flat board is put on an upright
// one, or is rotated about the wrong axis. So the measure is how much of the
// component is buried inside the board's own volume.
function orientation(b) {
  // Measure in the model's own frame. The render loop leaves the group spun to
  // whatever angle it finished on, and measuring through that rotation makes
  // every axis reading meaningless.
  b.group.rotation.set(0, 0, 0);
  b.group.scale.setScalar(1);
  b.group.updateMatrixWorld(true);
  const meshes = [];
  b.group.traverse(o => {
    if (!o.isMesh || o.userData.part === undefined) return;
    const bb = new T.Box3().setFromObject(o);
    meshes.push({ part: o.userData.part,
                  min: [bb.min.x, bb.min.y, bb.min.z], max: [bb.max.x, bb.max.y, bb.max.z],
                  s: [bb.max.x - bb.min.x, bb.max.y - bb.min.y, bb.max.z - bb.min.z] });
  });
  const thinAxis = d => d.indexOf(Math.min(...d));
  const span = Math.max(...meshes.map(m => Math.max(...m.s)), .001);
  // Truly flat: a case or chassis is a box things are mounted INSIDE, and a
  // component sitting within one is correct, not a fault.
  const boards = meshes.filter(m => Math.min(...m.s) < Math.max(...m.s) * .10
                                 && Math.max(...m.s) > span * .45);
  const out = [];
  for (const m of meshes) {
    if (Math.min(...m.s) > Math.max(...m.s) * .5) continue;   // no clear thin axis
    const ta = thinAxis(m.s);
    for (const bd of boards) {
      const ba = thinAxis(bd.s);
      if (ba === ta) continue;                                 // agrees: fine
      if (Math.max(...m.s) > Math.max(...bd.s) * .9) continue;  // not a component
      // A mounting surface is much larger than what sits on it in both of its
      // broad directions; otherwise this is some other nearby flat thing.
      let broad = true;
      for (let a = 0; a < 3; a++) if (a !== ba && bd.s[a] < m.s[a] * 3) broad = false;
      if (!broad) continue;
      // how much of the component lies inside the board, along the board's thin axis
      const lo = Math.max(m.min[ba], bd.min[ba]), hi = Math.min(m.max[ba], bd.max[ba]);
      const buried = Math.max(0, hi - lo) / Math.max(m.s[ba], 1e-6);
      if (buried < .2) continue;                               // sits on the face: fine
      // and it has to actually be over the board, not beside it
      let over = true;
      for (let a = 0; a < 3; a++) {
        if (a === ba) continue;
        if (m.min[a] > bd.max[a] || m.max[a] < bd.min[a]) over = false;
      }
      if (!over) continue;
      out.push({ part: m.part, thin: "xyz"[ta], boardThin: "xyz"[ba],
                 buried: Math.round(buried * 100), size: m.s.map(v => +v.toFixed(2)) });
      break;
    }
  }
  return out;
}

// ---- label distortion -------------------------------------------------------
// A texture is drawn on a canvas and then stretched onto a face. If the canvas
// aspect does not match the face aspect, the lettering is squashed or pulled.
// "Cache" sat on a face six times wider than deep, drawn on a square canvas.
function labels(b) {
  b.group.rotation.set(0, 0, 0);
  b.group.scale.setScalar(1);
  b.group.updateMatrixWorld(true);
  const out = [];
  b.group.traverse(o => {
    if (!o.isMesh || !o.geometry || !o.geometry.parameters) return;
    const g = o.geometry.parameters;
    if (g.width === undefined || g.depth === undefined) return;   // boxes only
    const sc = o.getWorldScale(new T.Vector3());
    const W = g.width * sc.x, H = g.height * sc.y, D = g.depth * sc.z;
    // BoxGeometry face order: +X, -X, +Y, -Y, +Z, -Z
    const faceAspect = [D / H, D / H, W / D, W / D, W / H, W / H];
    const mats = Array.isArray(o.material) ? o.material : [o.material];
    mats.forEach((m, i) => {
      if (!m || !m.map || !m.map.image) return;
      if (!(m.map.userData && m.map.userData.isLabel)) return;   // only lettering
      const img = m.map.image;
      const tex = img.width / img.height;
      const face = Array.isArray(o.material) ? faceAspect[i] : faceAspect[2];
      if (!isFinite(tex) || !isFinite(face) || face <= 0) return;
      const names = ["+X","-X","+Y","-Y","+Z","-Z"];
      const stretch = tex / face;
      if (stretch > 1.25 || stretch < .8) {
        out.push({ part: o.userData.part, face: names[i] || "?", why: "stretched",
                   texture: +tex.toFixed(2), faceAspect: +face.toFixed(2),
                   stretch: +stretch.toFixed(2) });
      }
      // Markings belong on a component's broad face, not on its edge. A label on
      // a narrow side is one a pupil turns the model over and still cannot read.
      if (Array.isArray(o.material)) {
        const area = [D * H, D * H, W * D, W * D, W * H, W * H];
        const biggest = Math.max(...area);
        if (area[i] < biggest * .75) {
          out.push({ part: o.userData.part, face: names[i], why: "on a narrow face",
                     texture: +tex.toFixed(2), faceAspect: +face.toFixed(2),
                     stretch: +(area[i] / biggest).toFixed(2) });
        }
      }
    });
  });
  return out;
}

// ---- parts passing through each other ---------------------------------------
// Only axis-aligned boxes are compared, because for those a bounding-box overlap
// IS the real overlap; for a cylinder or a torus it is a loose over-estimate and
// produces nonsense. A large box swallowing a small one is a case or a chassis
// with something mounted inside it, which is correct, so those are skipped.
function collisions(b) {
  b.group.rotation.set(0, 0, 0);
  b.group.scale.setScalar(1);
  b.group.updateMatrixWorld(true);
  const items = [];
  const q = new T.Quaternion(), e = new T.Euler();
  b.group.traverse(o => {
    if (!o.isMesh || o.userData.part === undefined) return;
    if (!o.geometry || o.geometry.type !== "BoxGeometry") return;
    o.getWorldQuaternion(q); e.setFromQuaternion(q);
    const axisAligned = [e.x, e.y, e.z].every(a => {
      const m = Math.abs(a) % (Math.PI / 2);
      return m < .02 || Math.PI / 2 - m < .02;
    });
    if (!axisAligned) return;
    const bb = new T.Box3().setFromObject(o);
    items.push({ part: o.userData.part, bb,
                 s: [bb.max.x - bb.min.x, bb.max.y - bb.min.y, bb.max.z - bb.min.z] });
  });
  const encloses = (A, B) => A.bb.min.x <= B.bb.min.x && A.bb.max.x >= B.bb.max.x
                          && A.bb.min.y <= B.bb.min.y && A.bb.max.y >= B.bb.max.y
                          && A.bb.min.z <= B.bb.min.z && A.bb.max.z >= B.bb.max.z;
  // Components routinely sink a little way into the board they are mounted on,
  // so that there is no daylight under them. Only component-against-component
  // overlaps are a mistake.
  const span = Math.max(...items.map(m => Math.max(...m.s)), .001);
  const isBoard = m => Math.min(...m.s) < Math.max(...m.s) * .12 && Math.max(...m.s) > span * .4;
  const worst = {};
  for (let i = 0; i < items.length; i++) for (let j = i + 1; j < items.length; j++) {
    const A = items[i], B = items[j];
    if (A.part === B.part) continue;
    if (isBoard(A) || isBoard(B)) continue;                  // sitting on a board: fine
    if (encloses(A, B) || encloses(B, A)) continue;          // mounted inside: fine
    // A part mounted in the surface of a case always stands a little proud of
    // it, so "not fully enclosed" is not enough on its own. If one part dwarfs
    // the other and holds its centre, the small one is mounted in or on it.
    const vol = X => X.s[0] * X.s[1] * X.s[2];
    const holds = (X, Y) => {
      const c = Y.bb.getCenter(new T.Vector3());
      return vol(X) > vol(Y) * 8 && X.bb.containsPoint(c);
    };
    if (holds(A, B) || holds(B, A)) continue;
    const d = [Math.min(A.bb.max.x, B.bb.max.x) - Math.max(A.bb.min.x, B.bb.min.x),
               Math.min(A.bb.max.y, B.bb.max.y) - Math.max(A.bb.min.y, B.bb.min.y),
               Math.min(A.bb.max.z, B.bb.max.z) - Math.max(A.bb.min.z, B.bb.min.z)];
    const EPS = 1e-3;
    if (d[0] <= EPS || d[1] <= EPS || d[2] <= EPS) continue;  // touching, not through
    const small = Math.min(A.s[0] * A.s[1] * A.s[2], B.s[0] * B.s[1] * B.s[2]);
    const frac = (d[0] * d[1] * d[2]) / Math.max(small, 1e-9);
    const key = A.part + ":" + B.part;
    if (!worst[key] || frac > worst[key].frac) worst[key] = { a: A.part, c: B.part, frac };
  }
  return Object.values(worst);
}

// ---- parts escaping the case ------------------------------------------------
// A model built around a case has every other part inside it. The washing
// machine's heater ran straight out through the floor of its casing and its
// control panel poked out of the front, and nothing noticed: both are boxes, but
// a part leaving the case collides with nothing, so the collision check is blind
// to it. This measures each part against whichever part encloses the rest.
function escapes(b) {
  b.group.rotation.set(0, 0, 0);
  b.group.scale.setScalar(1);
  b.group.updateMatrixWorld(true);
  const byPart = new Map();
  b.group.traverse(o => {
    if (!o.isMesh || o.userData.part === undefined) return;
    const bb = new T.Box3().setFromObject(o);
    const cur = byPart.get(o.userData.part);
    byPart.set(o.userData.part, cur ? cur.union(bb) : bb);
  });
  if (byPart.size < 3) return [];
  const items = [...byPart].map(([part, bb]) => ({ part, bb,
    s: [bb.max.x - bb.min.x, bb.max.y - bb.min.y, bb.max.z - bb.min.z] }));
  const vol = m => m.s[0] * m.s[1] * m.s[2];
  // The case is the biggest part, it has to be the biggest along every axis, and
  // it has to hold most of the others. The all-three-axes test is what keeps the
  // fibre cable out of this: its layers are stripped back on purpose, so the core
  // runs well past the jacket, and the jacket is wider but not longer.
  const cs = items.slice().sort((a, b2) => vol(b2) - vol(a))[0];
  for (const m of items)
    if (m !== cs) for (let a = 0; a < 3; a++) if (m.s[a] > cs.s[a] + 1e-6) return [];
  const held = items.filter(m => m !== cs && cs.bb.containsPoint(m.bb.getCenter(new T.Vector3())));
  if (held.length < (items.length - 1) * .67) return [];
  const span = Math.max(...cs.s);
  const out = [];
  for (const m of held) {
    let worst = 0, where = "";
    for (const a of ["x", "y", "z"]) {
      const lo = cs.bb.min[a] - m.bb.min[a], hi = m.bb.max[a] - cs.bb.max[a];
      if (lo > worst) { worst = lo; where = "-" + a; }
      if (hi > worst) { worst = hi; where = "+" + a; }
    }
    if (worst / span > .02) out.push({ part: m.part, out: +(worst / span).toFixed(3), face: where });
  }
  return out;
}

window.QC = function () {
  const out = {};
  for (const kind of R360Models.kinds) {
    // A fresh canvas per model: a canvas can only ever hold one WebGL context,
    // so reusing one silently returns blank frames for every model after the first.
    const canvas = document.createElement("canvas");
    canvas.width = 420; canvas.height = 340;
    document.getElementById("host").appendChild(canvas);
    const r = new T.WebGLRenderer({ antialias: false, canvas, preserveDrawingBuffer: true });
    r.setPixelRatio(1); r.setSize(420, 340, false);
    const scene = new T.Scene();
    const b = R360Models.build(kind);
    scene.add(b.group);
    R360Models.lights(scene, r);
    const cam = new T.PerspectiveCamera(38, 420 / 340, .1, 100);

    const best = b.parts.map(() => 0);
    let coverage = 0;
    for (const [rx, ry] of ANGLES) {
      const base = renderOnce(r, scene, cam, b, rx, ry);
      // how much of the frame the whole model occupies, as a sanity check
      let ink = 0;
      for (let i = 0; i < base.length; i += 4) if (base[i] + base[i+1] + base[i+2] > 60) ink++;
      coverage = Math.max(coverage, ink);
      b.parts.forEach((p, i) => {
        setVisible(p, false);
        const without = renderOnce(r, scene, cam, b, rx, ry);
        setVisible(p, true);
        best[i] = Math.max(best[i], diff(base, without));
      });
    }
    const mis = orientation(b);
    const lab = labels(b);
    const col = collisions(b);
    const esc = escapes(b);
    out[kind] = {
      coverage,
      parts: b.parts.map((p, i) => ({ name: p.name, pixels: best[i] })),
      misoriented: mis.map(m => ({ name: (b.parts[m.part] || {}).name || "?",
                                   thin: m.thin, boardThin: m.boardThin,
                                   buried: m.buried, size: m.size })),
      collisions: col.map(c => ({ a: (b.parts[c.a] || {}).name || "?",
                                  b: (b.parts[c.c] || {}).name || "?",
                                  overlap: Math.round(c.frac * 100) })),
      stretched: lab.map(l => ({ name: (b.parts[l.part] || {}).name || "?",
                                 face: l.face, stretch: l.stretch,
                                 texture: l.texture, faceAspect: l.faceAspect })),
      escaped: esc.map(e => ({ name: (b.parts[e.part] || {}).name || "?",
                               out: e.out, face: e.face }))
    };
    r.dispose(); canvas.remove();
  }
  return out;
};
</script>
</body></html>
